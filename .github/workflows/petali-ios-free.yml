name: Petali iOS - GitHub Actions gratuito
on:
  push:
    branches: [main]
    paths: ['.github/workflows/petali-ios-free.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Modalita build
        type: choice
        options: [check, testflight, live]
        default: check
      upload:
        description: Carica su App Store Connect (nessuna pubblicazione)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  ios:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      MODE: ${{ inputs.mode || 'check' }}
      SOURCE_SHA: d38012d33526307cbbc1a16df9afa5cca3232502
      PETALI_ADS_PLATFORM: ios
      PETALI_ADMOB_IOS_APP_ID: "ca-app-pub-7468719367826803~6209976584"
      PETALI_ADMOB_IOS_REWARDED_ID: "ca-app-pub-7468719367826803/7139914873"
    steps:
      - name: Checkout sorgenti verificati
        uses: actions/checkout@v4
        with:
          repository: eyjyssj5/petali-privacy
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - name: Verifica SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${sdk%%.*}" -ge 27
      - name: Test e preparazione progetto
        working-directory: source/android-snapshot-2026-10-27
        env:
          REVENUECAT_IOS_PUBLIC_KEY: ${{ secrets.REVENUECAT_IOS_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --save-exact @capacitor-community/admob@8.4.2 --no-audit --no-fund
          npm test
          if [ "$MODE" != check ]; then
            test -n "$REVENUECAT_IOS_PUBLIC_KEY" || { echo "::error::Manca il secret REVENUECAT_IOS_PUBLIC_KEY"; exit 1; }
          fi
          export PETALI_ADS_MODE=test
          if [ "$MODE" = live ]; then export PETALI_ADS_MODE=live; fi
          node native/configure-ads.mjs web
          npm run build:bridge
          npx cap add ios
          npx cap sync ios
          node native/configure-ads.mjs native
          ICON_DIR=ios/App/App/Assets.xcassets/AppIcon.appiconset
          mkdir -p "$ICON_DIR"
          tmp="$(mktemp -d)"
          sips -s format jpeg android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png --out "$tmp/icon.jpg" >/dev/null
          sips -s format png -z 1024 1024 "$tmp/icon.jpg" --out "$ICON_DIR/AppIcon-512@2x.png" >/dev/null
          python3 - "$ICON_DIR/Contents.json" <<'PY'
          import json, sys
          with open(sys.argv[1], 'w') as f:
              json.dump({'images':[{'filename':'AppIcon-512@2x.png','idiom':'universal','platform':'ios','size':'1024x1024'}],'info':{'author':'xcode','version':1}},f)
          PY
      - name: Compilazione gratuita senza firma
        if: env.MODE == 'check'
        working-directory: source/android-snapshot-2026-10-27/ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/petali-derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Installa certificato e profilo App Store
        if: env.MODE != 'check'
        env:
          P12: ${{ secrets.PETALI_IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.PETALI_IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.PETALI_IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$P12" && test -n "$P12_PASSWORD" && test -n "$PROFILE" || { echo "::error::Mancano i secret di firma Apple"; exit 1; }
          CERT="$RUNNER_TEMP/petali.p12"
          PROV="$RUNNER_TEMP/petali.mobileprovision"
          KC="$RUNNER_TEMP/petali-signing.keychain-db"
          KCPASS="$(openssl rand -hex 24)"
          echo "::add-mask::$KCPASS"
          printf '%s' "$P12" | base64 -D > "$CERT"
          printf '%s' "$PROFILE" | base64 -D > "$PROV"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC"
          security cms -D -i "$PROV" > "$RUNNER_TEMP/petali-profile.plist"
          python3 - "$RUNNER_TEMP/petali-profile.plist" <<'PY'
          import plistlib,sys,os,datetime
          p=plistlib.load(open(sys.argv[1],'rb'))
          team=p['TeamIdentifier'][0]
          ent=p['Entitlements']
          assert ent['application-identifier']==team+'.com.aivevia.petali', 'Profilo errato'
          assert not p.get('ProvisionedDevices') and not p.get('ProvisionsAllDevices') and not ent.get('get-task-allow'), 'Serve profilo App Store, non Ad Hoc'
          assert p['ExpirationDate'].replace(tzinfo=datetime.timezone.utc)>datetime.datetime.now(datetime.timezone.utc), 'Profilo scaduto'
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('APPLE_TEAM_ID='+team+'\nPROFILE_UUID='+p['UUID']+'\n')
          PY
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/petali-profile.plist")"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROV" "$dir/$uuid.mobileprovision"
          done
          security find-identity -v -p codesigning "$KC"
      - name: Compila IPA firmata
        if: env.MODE != 'check'
        working-directory: source/android-snapshot-2026-10-27/ios/App
        run: |
          set -euo pipefail
          build=$((8000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          test "$build" -le 9999
          agvtool new-marketing-version 1.0.1
          agvtool new-version -all "$build"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Petali.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" archive
          python3 - "$RUNNER_TEMP/ExportOptions.plist" <<'PY'
          import plistlib,sys,os
          d={'method':'app-store-connect','destination':'export','signingStyle':'manual','teamID':os.environ['APPLE_TEAM_ID'],'provisioningProfiles':{'com.aivevia.petali':os.environ['PROFILE_UUID']},'signingCertificate':'Apple Distribution'}
          if os.environ['MODE']=='testflight': d['testFlightInternalTestingOnly']=True
          with open(sys.argv[1],'wb') as f: plistlib.dump(d,f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Petali.xcarchive" -exportPath "$RUNNER_TEMP/petali-export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          mkdir -p "$GITHUB_WORKSPACE/output"
          ipa="$(find "$RUNNER_TEMP/petali-export" -name '*.ipa' -print -quit)"
          test -n "$ipa"
          cp "$ipa" "$GITHUB_WORKSPACE/output/Petali-1.0.1-$MODE.ipa"
      - name: Conserva IPA
        if: env.MODE != 'check'
        uses: actions/upload-artifact@v4
        with:
          name: Petali-iOS-${{ env.MODE }}
          path: output/*.ipa
          retention-days: 1
          if-no-files-found: error
      - name: Caricamento Apple facoltativo
        if: env.MODE != 'check' && inputs.upload == true
        env:
          ASC_KEY_ID: ${{ secrets.PETALI_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.PETALI_ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.PETALI_ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY" || { echo "::error::Mancano i secret App Store Connect"; exit 1; }
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app --type ios -f "$GITHUB_WORKSPACE/output/Petali-1.0.1-$MODE.ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Pulizia credenziali
        if: always() && env.MODE != 'check'
        run: |
          security delete-keychain "$RUNNER_TEMP/petali-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/petali.p12" "$RUNNER_TEMP/petali.mobileprovision" "$RUNNER_TEMP/petali-profile.plist"
          rm -rf "$HOME/.appstoreconnect/private_keys"
