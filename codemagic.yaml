# Petali: i sorgenti aggiornati sono nel repository petali-privacy, ramo release.
# Questo file genera un APK Android di prova e una IPA iOS firmata per App Store Connect.
workflows:
  petali-android-apk:
    name: Petali Android APK - prova
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: v22.11.0
      java: 21
    scripts:
      - name: Recupera sorgenti aggiornati
        script: |
          set -euo pipefail
          git clone --depth 1 --branch release/petali-pagamenti-verifica-2026-10-28 https://github.com/eyjyssj5/petali-privacy.git "$CM_BUILD_DIR/petali-build"
      - name: Test e compilazione APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/petali-build/android-snapshot-2026-10-27"
          python3 verifica_petali.py
          npm ci --no-audit --no-fund
          npm test
          npm run build:bridge
          npx cap sync android
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > android/local.properties
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> android/gradle.properties
          cd android
          chmod +x gradlew
          echo "Java usata da Codemagic:"
          java -version
          ./gradlew --version
          mkdir -p "$CM_EXPORT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$CM_EXPORT_DIR/Petali-Android-build.log"
          cp app/build/outputs/apk/debug/app-debug.apk "$CM_EXPORT_DIR/Petali-Android.apk"
          test -s "$CM_EXPORT_DIR/Petali-Android.apk"
    artifacts:
      - $CM_EXPORT_DIR/Petali-Android.apk
      - $CM_EXPORT_DIR/Petali-Android-build.log

  petali-ios-compile:
    name: Petali iOS App Store - IPA firmata
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: SimulaEsame-Codemagic
    environment:
      groups:
        - petali_revenuecat
      node: v22.11.0
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aivevia.petali
    scripts:
      - name: Recupera sorgenti Petali per iPhone
        script: |
          set -euo pipefail
          git clone --depth 1 --branch release/petali-pagamenti-verifica-2026-10-28 https://github.com/eyjyssj5/petali-privacy.git "$CM_BUILD_DIR/petali-build"
      - name: Prepara progetto iOS
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/petali-build/android-snapshot-2026-10-27"
          npm ci --no-audit --no-fund
          npm test
          if [ -z "${REVENUECAT_IOS_PUBLIC_KEY:-}" ]; then
            echo "ERRORE: chiave pubblica RevenueCat iOS mancante. Configura REVENUECAT_IOS_PUBLIC_KEY in Codemagic prima di generare la build App Store."
            exit 2
          fi
          npm run build:bridge
          npx cap add ios
          npx cap sync ios
          # PETALI: applica l'icona floreale già utilizzata su Android anche a iOS.
          # Il catalogo AppIcon è generato da Capacitor, quindi l'icona va sostituita ad ogni build.
          swift native/make-ios-app-icon.swift \
            "$PWD/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" \
            "$PWD/ios/App/App/Assets.xcassets/AppIcon.appiconset"
      - name: Associa certificato e profilo Apple
        script: |
          set -euo pipefail
          PROJECT="$CM_BUILD_DIR/petali-build/android-snapshot-2026-10-27/ios/App/App.xcodeproj"
          test -d "$PROJECT"
          xcode-project use-profiles --project "$PROJECT"
      - name: Aggiorna numero build per TestFlight
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/petali-build/android-snapshot-2026-10-27/ios/App"
          BUILD_INDEX="${CM_BUILD_NUMBER:-1}"
          case "$BUILD_INDEX" in
            ''|*[!0-9]*) echo "Numero di compilazione Codemagic non valido"; exit 1 ;;
          esac
          NEXT_BUILD_NUMBER=$(( BUILD_INDEX + 1 ))
          if [ "$NEXT_BUILD_NUMBER" -lt 2 ]; then NEXT_BUILD_NUMBER=2; fi
          agvtool new-version -all "$NEXT_BUILD_NUMBER"
          echo "Numero iOS per il prossimo upload: $NEXT_BUILD_NUMBER"
      - name: Genera IPA firmata per App Store Connect
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/petali-build/android-snapshot-2026-10-27/ios/App"
          xcode-project build-ipa --project App.xcodeproj --scheme App
          IPA="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          mkdir -p "$CM_EXPORT_DIR"
          cp "$IPA" "$CM_EXPORT_DIR/Petali-iOS-AppStore.ipa"
          test -s "$CM_EXPORT_DIR/Petali-iOS-AppStore.ipa"
    artifacts:
      - $CM_EXPORT_DIR/Petali-iOS-AppStore.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false

  petali-ios-ad-hoc:
    name: Petali iOS Ad Hoc - installazione su iPhone
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: SimulaEsame-Codemagic
    environment:
      groups:
        - petali_revenuecat
      node: v22.11.0
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.aivevia.petali
    scripts:
      - name: Recupera sorgenti Petali per iPhone
        script: |
          set -euo pipefail
          git clone --depth 1 --branch release/petali-pagamenti-verifica-2026-10-28 https://github.com/eyjyssj5/petali-privacy.git "$CM_BUILD_DIR/petali-build"
      - name: Prepara progetto iOS
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/petali-build/android-snapshot-2026-10-27"
          npm ci --no-audit --no-fund
          npm test
          if [ -z "${REVENUECAT_IOS_PUBLIC_KEY:-}" ]; then
            echo "ERRORE: chiave pubblica RevenueCat iOS mancante. Configura REVENUECAT_IOS_PUBLIC_KEY in Codemagic prima di generare la build App Store."
            exit 2
          fi
          npm run build:bridge
          npx cap add ios
          npx cap sync ios
          # PETALI: applica l'icona floreale già utilizzata su Android anche a iOS.
          # Il catalogo AppIcon è generato da Capacitor, quindi l'icona va sostituita ad ogni build.
          swift native/make-ios-app-icon.swift \
            "$PWD/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" \
            "$PWD/ios/App/App/Assets.xcassets/AppIcon.appiconset"
      - name: Associa certificato e profilo Apple
        script: |
          set -euo pipefail
          PROJECT="$CM_BUILD_DIR/petali-build/android-snapshot-2026-10-27/ios/App/App.xcodeproj"
          test -d "$PROJECT"
          # Usa esclusivamente il profilo appena generato per iPhone 14.
          # Evita di selezionare un vecchio profilo Ad Hoc con lo stesso bundle ID.
          EXPECTED_UUID="a62933cd-33e5-4712-a73f-43099b5149c9"
          EXPECTED_UDID="00008110-000609C102FB801E"
          PROFILE_SELECTED=""
          for PROFILE in "$HOME"/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision "$HOME"/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision; do
            [ -f "$PROFILE" ] || continue
            PLIST="$CM_BUILD_DIR/petali-candidate-profile.plist"
            /usr/bin/security cms -D -i "$PROFILE" > "$PLIST" 2>/dev/null || continue
            PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST" 2>/dev/null || true)"
            if [ "$PROFILE_UUID" = "$EXPECTED_UUID" ]; then
              if ! /usr/bin/grep -q "$EXPECTED_UDID" "$PLIST"; then
                echo "ERRORE: profilo trovato ma iPhone 14 non autorizzato."
                exit 2
              fi
              PROFILE_SELECTED="$PROFILE"
              break
            fi
          done
          if [ -z "$PROFILE_SELECTED" ]; then
            echo "ERRORE: profilo Petali-iPhone14-AdHoc non caricato su Codemagic."
            echo "Carica il file con Reference name Petali-iPhone14-AdHoc in Code signing identities > iOS provisioning profiles."
            exit 2
          fi
          echo "Profilo corretto trovato: $EXPECTED_UUID (iPhone 14 incluso)"
          xcode-project use-profiles --project "$PROJECT" --profile "$PROFILE_SELECTED" --archive-method=ad-hoc
      - name: Aggiorna numero build per installazione Ad Hoc
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/petali-build/android-snapshot-2026-10-27/ios/App"
          BUILD_INDEX="${CM_BUILD_NUMBER:-1}"
          case "$BUILD_INDEX" in
            ''|*[!0-9]*) echo "Numero di compilazione Codemagic non valido"; exit 1 ;;
          esac
          NEXT_BUILD_NUMBER=$(( BUILD_INDEX + 1 ))
          if [ "$NEXT_BUILD_NUMBER" -lt 2 ]; then NEXT_BUILD_NUMBER=2; fi
          agvtool new-version -all "$NEXT_BUILD_NUMBER"
          echo "Numero iOS per il prossimo upload: $NEXT_BUILD_NUMBER"
      - name: Genera IPA Ad Hoc per iPhone
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/petali-build/android-snapshot-2026-10-27/ios/App"
          xcode-project build-ipa --project App.xcodeproj --scheme App
          IPA="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          mkdir -p "$CM_EXPORT_DIR"
          cp "$IPA" "$CM_EXPORT_DIR/Petali-iOS-AdHoc.ipa"
          test -s "$CM_EXPORT_DIR/Petali-iOS-AdHoc.ipa"
    artifacts:
      - $CM_EXPORT_DIR/Petali-iOS-AdHoc.ipa
      - /tmp/xcodebuild_logs/*.log
