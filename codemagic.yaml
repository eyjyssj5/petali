# Petali: i sorgenti aggiornati sono nel repository petali-privacy, ramo release.
# Questo file genera un APK Android di prova e, separatamente, una IPA iOS NON firmata.
workflows:
  petali-android-apk:
    name: Petali Android APK - prova
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: v22.11.0
      java: 21
    scripts:
      - name: Recupera sorgenti aggiornati
        script: |
          set -euo pipefail
          git clone --depth 1 --branch release/petali-pagamenti-verifica-2026-10-28 https://github.com/eyjyssj5/petali-privacy.git "$CM_BUILD_DIR/petali-build"
      - name: Test e compilazione APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/petali-build/android-snapshot-2026-10-27"
          python3 verifica_petali.py
          npm ci --no-audit --no-fund
          npm test
          npm run build:bridge
          npx cap sync android
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > android/local.properties
          printf '\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' >> android/gradle.properties
          cd android
          chmod +x gradlew
          echo "Java usata da Codemagic:"
          java -version
          ./gradlew --version
          mkdir -p "$CM_EXPORT_DIR"
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee "$CM_EXPORT_DIR/Petali-Android-build.log"
          cp app/build/outputs/apk/debug/app-debug.apk "$CM_EXPORT_DIR/Petali-Android.apk"
          test -s "$CM_EXPORT_DIR/Petali-Android.apk"
    artifacts:
      - $CM_EXPORT_DIR/Petali-Android.apk
      - $CM_EXPORT_DIR/Petali-Android-build.log

  petali-ios-compile:
    name: Petali iOS IPA - non firmata
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: v22.11.0
      xcode: latest
    scripts:
      - name: Recupera sorgenti aggiornati
        script: |
          set -euo pipefail
          git clone --depth 1 --branch release/petali-pagamenti-verifica-2026-10-28 https://github.com/eyjyssj5/petali-privacy.git "$CM_BUILD_DIR/petali-build"
      - name: Prepara progetto iOS
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/petali-build/android-snapshot-2026-10-27"
          npm ci --no-audit --no-fund
          npm run build:bridge
          npx cap add ios
          npx cap sync ios
      - name: Compila iOS senza firma Apple
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/petali-build/android-snapshot-2026-10-27/ios/App"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath "$CM_BUILD_DIR/petali-ios-derived" build
          mkdir -p "$CM_EXPORT_DIR/Payload"
          cp -R "$CM_BUILD_DIR/petali-ios-derived/Build/Products/Release-iphoneos/App.app" "$CM_EXPORT_DIR/Payload/"
          cd "$CM_EXPORT_DIR"
          zip -q -r Petali-iOS-UNSIGNED.ipa Payload
          rm -rf Payload
    artifacts:
      - $CM_EXPORT_DIR/Petali-iOS-UNSIGNED.ipa
