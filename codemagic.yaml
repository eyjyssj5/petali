          unzip -tq "$BUNDLE" >/dev/null
          cp "$BUNDLE" "$CM_EXPORT_DIR/Petali-Crediti-LIVE-Play-FIRMATO.aab"
          shasum -a 256 "$CM_EXPORT_DIR/Petali-Crediti-LIVE-Play-FIRMATO.aab"
    artifacts:
      - $CM_EXPORT_DIR/Petali-Crediti-LIVE-Play-FIRMATO.aab
      - $CM_EXPORT_DIR/Petali-Regali-V2-AAB-build.log
      - $CM_EXPORT_DIR/Petali-Regali-V2-signature-check.log
